<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>坏点匣 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">坏点匣</h1>
      <div class="骨">未过质控门槛的报文旁路。升格回放走双写两轨：原行进只读归档影子，现行入栏带升格指纹。</div>
    </header>

    <section class="卷">
      <h2>升格回放</h2>
      <div class="工具">
        <input class="只读框" id="匣号" placeholder="坏点编号，多个用逗号，如 1,2" style="min-width:260px"/>
        <button class="按钮 青" id="升格">升格回放所选</button>
        <span id="升格果" class="说明"></span>
      </div>
      <p class="说明">无键（不带坏点编号）回放切流拒绝；同指纹二次回放幂等拒绝；升格与销匣同票同成败。</p>
    </section>

    <section class="卷">
      <h2>坏点匣（现行在匣 + 归档影子）</h2>
      <div class="表绕"><table><thead><tr><th>编号</th><th>报文编号</th><th>站点</th><th>原因</th><th>读数</th><th>观测时</th><th>坏点状态</th><th>升格指纹</th><th>升格时</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>

    <section class="卷">
      <h2>升格账册（切流账 · 只读）</h2>
      <div class="表绕"><table><thead><tr><th>升格指纹</th><th>坏点编号</th><th>报文编号</th><th>栏号</th><th>时刻</th></tr></thead><tbody id="账表"></tbody></table></div>
    </section>

    <script>
    function 状态徽章(s) {
      if (s === "已升格") return 探栏.徽章("已升格·影子", "好");
      return 探栏.徽章(s || "在匣", "警");
    }
    async function 刷匣子() {
      const rows = await 探栏.getJSON("/api/坏点匣");
      const tb = document.getElementById("表");
      if (!rows.length) { tb.innerHTML = `<tr><td colspan="9">${探栏.空态("坏点匣为空。灌坏点样例可看到越界旁路。")}</td></tr>`; return; }
      tb.innerHTML = "";
      for (const r of rows) {
        tb.appendChild(探栏.行(
          `<td>${r.编号}</td>` +
          `<td>${探栏.安全文本(r.报文编号)}</td>` +
          `<td>${探栏.安全文本(r.站点键)}</td>` +
          `<td>${探栏.徽章(r.原因,"警")}</td>` +
          `<td>${r.读数}</td>` +
          `<td>${探栏.安全文本(r.观测时)}</td>` +
          `<td>${状态徽章(r.坏点状态)}</td>` +
          `<td>${探栏.安全文本(r.升格指纹 || "—")}</td>` +
          `<td>${探栏.安全文本(r.升格时 || "—")}</td>`
        ));
      }
    }
    async function 刷账() {
      const rows = await 探栏.getJSON("/api/坏点升格回放");
      const tb = document.getElementById("账表");
      if (!rows.length) { tb.innerHTML = `<tr><td colspan="5">${探栏.空态("尚无升格账。升格后此处钉指纹，串起影子与现行入栏。")}</td></tr>`; return; }
      tb.innerHTML = "";
      for (const r of rows) {
        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(r.升格指纹)}</td><td>${r.坏点编号}</td>` +
          `<td>${探栏.安全文本(r.报文编号)}</td><td>${探栏.安全文本(r.栏号)}</td>` +
          `<td>${探栏.安全文本(r.时刻)}</td>`
        ));
      }
    }
    document.getElementById("升格").onclick = async () => {
      const 果 = document.getElementById("升格果");
      const raw = document.getElementById("匣号").value.trim();
      const 坏点编号 = raw.split(",").map((s) => parseInt(s.trim(), 10)).filter((n) => Number.isInteger(n));
      try {
        const r = await 探栏.postJSON("/api/坏点升格回放/跑", { 坏点编号 });
        果.innerHTML = 探栏.徽章(`已升格 ${r.升格} 笔 · ${r.升格指纹}`, "好");
        await Promise.all([刷匣子(), 刷账()]);
      } catch (e) {
        果.innerHTML = 探栏.徽章("拒绝:" + String(e), "危");
      }
    };
    刷匣子();
    刷账();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" class="亮">坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
